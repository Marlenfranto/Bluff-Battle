name: networking_game
description: "Bluff Battle"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # UI & Animations
  google_fonts: ^6.2.1
  confetti: ^0.8.0
  shimmer: ^3.0.0
  fl_chart: ^0.70.2

  # Utils
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
